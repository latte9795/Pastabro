<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pasta Bro - 매출 보고</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f0eb">
<style>
:root{
  --warm:#f5f0eb;--card:#fff;--text:#1a1a1a;--sub:#666;--muted:#999;
  --border:#e0d8cf;--accent:#6b8e5a;--accent2:#a3b18a;--green:#2d6a4f;
  --red:#c1121f;--blue:#1e4d8c;--blight:#f0ebe4;--cream:#faf7f2;
  --sans:'Pretendard',system-ui,-apple-system,sans-serif;
  --serif:'Playfair Display',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--warm);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto}

.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr .back{background:none;border:none;font-size:18px;cursor:pointer;padding:4px}
.hdr h1{font-family:var(--serif);font-size:17px;font-weight:600;flex:1}
.curM{font-size:13px;font-weight:600}

.tabBar{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 16px}
.tBtn{flex:1;max-width:200px;padding:12px 16px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--sans)}
.tBtn.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

.navWrap{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.navArr{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:14px;cursor:pointer;color:var(--sub);font-family:var(--sans);display:flex;align-items:center;justify-content:center}
.navArr:hover{background:var(--blight);color:var(--text)}
.mnav{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;scroll-behavior:smooth}
.mnav::-webkit-scrollbar{display:none}
.mchip{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:11px;white-space:nowrap;cursor:pointer;font-family:var(--sans);color:var(--sub);flex-shrink:0}
.mchip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

.panel{display:none}
.panel.show{display:block}

.summary{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:720px){.summary{grid-template-columns:repeat(4,1fr)}}
.sCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.sCard.wide{grid-column:1/-1}
.sCard .sl{font-size:11px;color:var(--sub)}
.sCard .sv{font-size:18px;font-weight:700;font-family:var(--serif);margin-top:2px}
.sCard .sv.green{color:var(--green)}
.tWrap{padding:0 8px 100px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:11px;width:100%;min-width:900px}
thead{position:sticky;top:56px;z-index:10}
th{background:var(--card);border:1px solid var(--border);padding:6px 8px;text-align:center;font-weight:600;white-space:nowrap;color:var(--sub);font-size:10px}
td{border:1px solid var(--border);padding:6px 8px;text-align:right;white-space:nowrap;background:var(--card)}
td:first-child,td:nth-child(2){text-align:center;font-weight:500}
tr:last-child td{font-weight:700;background:var(--blight)}
tr.holiday td{color:var(--red)}

.alyt{padding:14px;padding-bottom:100px}

.heroBar{background:linear-gradient(135deg,var(--cream),#fff);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.heroBar .hbT{font-size:11px;color:var(--sub);letter-spacing:.04em}
.heroBar .hbD{font-size:14px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
.heroBar .hbDow{font-size:13px;color:var(--sub);font-weight:500}
.heroBar .hbInput{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;font-family:var(--sans);background:#fff;cursor:pointer;color:var(--text);font-weight:500}
.heroBar .hbInput:hover{border-color:var(--accent)}
.heroBar .hbV{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}

.topGrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:680px){.topGrid{grid-template-columns:280px 1fr}}

.payCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.payCard h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px}
.payToday{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px}
.payBox{position:relative;height:220px}

.metricCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.metricCard h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:10px}
.mList{display:flex;flex-direction:column;gap:0}
.mItem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--blight)}
.mItem:last-child{border-bottom:none}
.mItem .mL{font-size:12px;color:var(--text);font-weight:500}
.mItem .mL.dim{color:var(--muted);font-weight:400}
.mItem .mR{display:flex;align-items:center;gap:8px;font-size:12px}
.mItem .mPct{font-weight:700;font-family:var(--serif);font-size:14px}
.mItem .mPct.up{color:var(--red)}
.mItem .mPct.down{color:var(--blue)}
.mItem .mPct.neu{color:var(--muted)}
.mItem .mAmt{color:var(--sub);font-size:11px;font-family:var(--serif)}
.mItem .mNd{color:var(--muted);font-size:11px;font-style:italic}

.chartCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.chartCard h3{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.chartCard h3 .cumul{font-size:11px;font-weight:500;color:var(--sub);background:var(--blight);padding:3px 8px;border-radius:999px;font-family:var(--serif)}
.chartCard h3 .cumul.up{color:var(--red);background:#fdf0f0}
.chartCard h3 .cumul.down{color:var(--blue);background:#eef2f8}
.chartCard .ch3sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.chartBox{position:relative;height:240px}
.chartBox.tall{height:280px}

.alytLoad,.alytErr{text-align:center;padding:40px 20px;font-size:13px;color:var(--muted)}
.alytErr{color:var(--red)}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.err{text-align:center;padding:40px 20px;color:var(--red);font-size:13px}

@media(max-width:680px){
  .heroBar .hbV{font-size:20px}
  .metricCard{padding:12px 14px}
  .mItem .mL{font-size:11px}
  .mItem .mR{font-size:11px}
  .mItem .mPct{font-size:13px}
}
</style>
</head>
<body>

<div class="wrap">
<div class="hdr">
  <button class="back" onclick="location.href='index.html'">←</button>
  <h1>매출 보고</h1>
  <span id="curMonth" class="curM"></span>
</div>

<div class="tabBar">
  <button class="tBtn on" data-tab="report">📊 매출표</button>
  <button class="tBtn" data-tab="alyt">📈 분석 리포트</button>
</div>

<div class="navWrap">
  <button class="navArr" id="nL" title="이전">◁</button>
  <div class="mnav" id="mNav"></div>
  <button class="navArr" id="nR" title="다음">▷</button>
</div>

<div class="panel show" id="pReport">
  <div id="sumArea" class="summary" style="display:none"></div>
  <div class="tWrap">
    <div id="content" class="loading">데이터를 불러오는 중...</div>
  </div>
</div>

<div class="panel" id="pAlyt">
  <div class="alyt" id="alytBody">
    <div class="alytLoad">분석 데이터를 준비하는 중...</div>
  </div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SHEET_ID="13w8Z3XFM3EqGpx-YGuW4YIx5H9Qk4Z64Gu1jvT-siYw";
const API_KEY="AIzaSyAobLBmEc8I8zGJdpjOVQxX3_347TZNJJo";
const $=id=>document.getElementById(id);
const fmt=n=>{if(n===null||n===undefined||n==="")return"-";const v=Number(n);return isNaN(v)?""+n:"₩"+Math.round(v).toLocaleString()};
const fmtK=n=>{if(!n)return"₩0";if(n>=10000000)return"₩"+(n/10000000).toFixed(1)+"천만";if(n>=10000)return"₩"+(n/10000).toFixed(0)+"만";return"₩"+n.toLocaleString()};
const DOWK=["일","월","화","수","목","금","토"];

// 숫자 변환 (string "1,500,000" / "₩1,500,000" / number 모두 처리)
function num(v){
  if(typeof v==="number")return v;
  if(typeof v==="string"){
    const c=v.replace(/[₩,원\s]/g,"").trim();
    if(!c||c==="-")return 0;
    const n=Number(c);
    return isNaN(n)?0:n;
  }
  return 0;
}

// 헤더 행 자동 감지: "날짜" 단어가 있는 행
function findHeaderIdx(rows){
  for(let i=0;i<Math.min(rows.length,5);i++){
    const r=rows[i];
    if(!r)continue;
    if(r.some(c=>typeof c==="string"&&c.trim()==="날짜"))return i;
  }
  return 1;
}

firebase.initializeApp({apiKey:"AIzaSyArHG7EbxhV5cIIixOcY9y162svZXx7ffA",authDomain:"pastabro-4e5b0.firebaseapp.com",projectId:"pastabro-4e5b0",storageBucket:"pastabro-4e5b0.firebasestorage.app",messagingSenderId:"614383037631",appId:"1:614383037631:web:7ec4593968f5832cb3aa0a"});
const au=firebase.auth();
au.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

au.onAuthStateChanged(u=>{
  if(!u){
    $("content").className="err";
    $("content").innerHTML='⚠️ 로그인 정보가 없습니다.<br><br><a href="index.html" style="color:var(--accent);text-decoration:underline">← 메인으로</a>';
    return;
  }
  init();
});

let allSheets=[],currentSheet=null,sheetCache={},alytLoaded=false;

async function init(){
  const metaUrl=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}&fields=sheets.properties`;
  const res=await fetch(metaUrl);
  if(!res.ok){$("content").className="err";$("content").textContent="시트 접근 실패: "+res.status;return}
  const meta=await res.json();
  allSheets=meta.sheets.map(s=>s.properties.title).filter(t=>/\d{4}-\d{2}월/.test(t)).sort();
  if(!allSheets.length){$("content").className="err";$("content").textContent="매출보고 시트 탭을 찾을 수 없습니다";return}

  const nav=$("mNav");
  allSheets.forEach(name=>{
    const m=name.match(/(\d{4})-(\d{2})월/);
    const label=m?`${m[1]}.${parseInt(m[2])}월`:"?";
    const chip=document.createElement("button");
    chip.className="mchip";chip.textContent=label;chip.dataset.sheet=name;
    chip.addEventListener("click",()=>{loadSheet(name);scrollChipIntoView(chip)});
    nav.appendChild(chip);
  });

  $("nL").addEventListener("click",()=>nav.scrollBy({left:-200,behavior:"smooth"}));
  $("nR").addEventListener("click",()=>nav.scrollBy({left:200,behavior:"smooth"}));

  loadSheet(allSheets[allSheets.length-1]);
  setTimeout(()=>nav.scrollLeft=nav.scrollWidth,100);
}

function scrollChipIntoView(chip){
  const nav=$("mNav");
  const cl=chip.offsetLeft,cw=chip.offsetWidth;
  const sl=nav.scrollLeft,nw=nav.clientWidth;
  if(cl<sl)nav.scrollTo({left:cl-10,behavior:"smooth"});
  else if(cl+cw>sl+nw)nav.scrollTo({left:cl+cw-nw+10,behavior:"smooth"});
}

async function loadSheet(name){
  currentSheet=name;
  document.querySelectorAll(".mchip").forEach(c=>c.classList.toggle("on",c.dataset.sheet===name));
  const m=name.match(/(\d{4})-(\d{2})월/);
  $("curMonth").textContent=m?`${m[1]}년 ${parseInt(m[2])}월`:"";
  $("content").className="loading";$("content").innerHTML="데이터를 불러오는 중...";
  $("sumArea").style.display="none";

  let data;
  if(sheetCache[name]){data=sheetCache[name]}
  else{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(name)}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
    const res=await fetch(url);
    if(!res.ok){$("content").className="err";$("content").textContent="데이터 로드 실패: "+res.status;return}
    data=await res.json();
    sheetCache[name]=data;
  }
  const rows=data.values||[];
  if(rows.length<2){$("content").className="err";$("content").textContent="데이터가 없습니다";return}

  const hIdx=findHeaderIdx(rows);
  const headers=rows[hIdx]||[];
  const dataRows=rows.slice(hIdx+1);
  let summaryRow=null;
  const lastData=dataRows[dataRows.length-1];
  if(lastData&&lastData[0]&&typeof lastData[0]==="string"&&lastData[0].includes("총매출")){
    summaryRow=dataRows.pop();
  }
  renderSummary(headers,dataRows,summaryRow);
  renderTable(headers,dataRows,summaryRow);
}

function getColIdx(headers){
  const idx={};
  headers.forEach((h,i)=>{idx[(""+h).trim()]=i});
  return{
    total:idx["총 매출"]??idx["총매출"]??2,
    vat:idx["vat"]??idx["VAT"]??3,
    net:idx["순매출"]??4,
    card:idx["카드매출"]??5,
    cash:idx["현금 매출"]??idx["현금매출"]??6,
    toss:idx["간편결제(토스페이)"]??idx["간편결제"]??7,
    prepay:idx["선결제(차감)"]??idx["선결제차감"]??8,
    seoul:idx["서울페이"]??9,
    prepayX:idx["선결제(매출x)"]??10,
    bank:idx["계좌이체"]??11,
    baeminCard:idx["배민현장 카드"]??12,
    baeminCash:idx["배민현장 현금"]??13,
    delivery:idx["선결제"]??14,
    baemin:idx["배민"]??-1,
    coupang:idx["쿠팡"]??-1,
    yogiyo:idx["요기요"]??-1,
    ddang:idx["땡겨요"]??-1
  };
}

function renderSummary(headers,dataRows,summaryRow){
  const sa=$("sumArea");
  const ci=getColIdx(headers);
  let totalSales=0,cardSales=0,cashSales=0,deliverySales=0;
  dataRows.forEach(r=>{
    totalSales+=num(r[ci.total]);
    cardSales+=num(r[ci.card]);
    cashSales+=num(r[ci.cash]);
    // 배달 = delivery (선결제) 컬럼. 카톡백업 시트도 K열이 SUM이라 동일하게 잡힘
    deliverySales+=num(r[ci.delivery]);
  });
  sa.style.display="grid";
  sa.innerHTML=`
    <div class="sCard wide"><div class="sl">월 총매출</div><div class="sv green">${fmt(totalSales)}</div></div>
    <div class="sCard"><div class="sl">카드</div><div class="sv">${fmt(cardSales)}</div></div>
    <div class="sCard"><div class="sl">현금</div><div class="sv">${fmt(cashSales)}</div></div>
    <div class="sCard"><div class="sl">배달</div><div class="sv">${fmt(deliverySales)}</div></div>`;
}

function renderTable(headers,dataRows,summaryRow){
  let html='<table><thead><tr>';
  headers.forEach(h=>html+=`<th>${h||""}</th>`);
  html+='</tr></thead><tbody>';
  dataRows.forEach(r=>{
    const dow=r[1]||"";
    const isHoliday=dow==="일"||dow==="토";
    html+=`<tr${isHoliday?' class="holiday"':''}>`;
    headers.forEach((h,i)=>{
      let v=r[i]??"";
      if(i===0&&typeof v==="number"){
        const d=new Date((v-25569)*86400000);
        v=`${d.getMonth()+1}/${d.getDate()}`;
      }else if(i===0&&typeof v==="string"&&v.includes("-")){
        const parts=v.split("-");
        v=`${parseInt(parts[1])}/${parseInt(parts[2])}`;
      }
      // 숫자 컬럼: number든 string이든 num()으로 변환
      if(i>=2){
        const n=num(v);
        if(n)v="₩"+n.toLocaleString();
        else if(v===""||v===0||v==="-"||v===null||v===undefined)v="-";
        else v=String(v); // 변환 실패한 string은 그대로
      }
      html+=`<td>${v}</td>`;
    });
    html+='</tr>';
  });
  if(summaryRow){
    html+='<tr>';
    headers.forEach((h,i)=>{
      let v=summaryRow[i]??"";
      if(i>=2){
        const n=num(v);
        if(n)v="₩"+n.toLocaleString();
        else v="-";
      }
      html+=`<td>${v}</td>`;
    });
    html+='</tr>';
  }
  html+='</tbody></table>';
  $("content").className="tWrap";
  $("content").innerHTML=html;
}

document.querySelectorAll(".tBtn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tBtn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const t=b.dataset.tab;
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
  $(t==="report"?"pReport":"pAlyt").classList.add("show");
  if(t==="alyt"&&!alytLoaded)loadAnalytics();
}));

// ─────── Analytics ───────
let allMonthData={};
let chartInstances={};
let analyticsAllRows=[];

async function loadAnalytics(){
  $("alytBody").innerHTML='<div class="alytLoad">분석 데이터를 불러오는 중... (시트 '+allSheets.length+'개)</div>';
  const ranges=allSheets.map(n=>`ranges=${encodeURIComponent(n)}`).join("&");
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchGet?${ranges}&key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
  const res=await fetch(url);
  if(!res.ok){$("alytBody").innerHTML='<div class="alytErr">데이터 로드 실패: '+res.status+'</div>';return}
  const data=await res.json();
  if(!data.valueRanges){$("alytBody").innerHTML='<div class="alytErr">데이터 형식 오류</div>';return}

  data.valueRanges.forEach((vr,idx)=>{
    const name=allSheets[idx];
    const rows=vr.values||[];
    if(rows.length<2)return;
    const hIdx=findHeaderIdx(rows);
    const headers=rows[hIdx]||[];
    let dataRows=rows.slice(hIdx+1);
    const last=dataRows[dataRows.length-1];
    if(last&&last[0]&&typeof last[0]==="string"&&last[0].includes("총매출"))dataRows.pop();
    const ci=getColIdx(headers);
    const parsedRows=dataRows.map(r=>{
      let dt=null;
      const v=r[0];
      if(typeof v==="number"){dt=new Date((v-25569)*86400000)}
      else if(typeof v==="string"&&v.includes("-")){
        const parts=v.split("-");
        if(parts.length>=3)dt=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
      }
      if(dt&&!isNaN(dt))dt.setHours(0,0,0,0);
      return{date:dt,dow:r[1]||"",total:num(r[ci.total]),raw:r};
    }).filter(r=>r.date&&!isNaN(r.date));
    allMonthData[name]={headers,rows:dataRows,parsedRows,colIdx:ci};
  });

  analyticsAllRows=Object.values(allMonthData).flatMap(m=>m.parsedRows).filter(r=>r.total>0);
  alytLoaded=true;
  renderAnalytics();
}

function addDays(d,n){const x=new Date(d);x.setDate(d.getDate()+n);return x}
function findRow(rows,d){const t=d.getTime();return rows.find(r=>r.date.getTime()===t)}
function pctClass(p){return p>0?'up':p<0?'down':'neu'}
function pctText(p){if(p===null||!isFinite(p))return'-';return(p>=0?'△ ':'▽ ')+Math.abs(p).toFixed(1)+'%'}
function isoStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function shortDate(d){return `${d.getMonth()+1}/${d.getDate()} (${DOWK[d.getDay()]})`}

function getISOWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return{year:t.getUTCFullYear(),week:Math.ceil(((t-ys)/86400000+1)/7)}
}
function getMondayOfWeek(year,week){
  const jan4=new Date(Date.UTC(year,0,4));
  const jan4Dow=jan4.getUTCDay()||7;
  const monday=new Date(jan4);monday.setUTCDate(jan4.getUTCDate()-(jan4Dow-1)+(week-1)*7);
  return new Date(monday.getUTCFullYear(),monday.getUTCMonth(),monday.getUTCDate());
}

const starPlugin={
  id:'starMarker',
  afterDatasetsDraw(chart,args,opts){
    if(!opts||opts.point===undefined||opts.point<0)return;
    const{ctx}=chart;
    const meta=chart.getDatasetMeta(opts.datasetIdx??0);
    const pt=meta.data[opts.point];
    if(!pt)return;
    ctx.save();
    drawStar(ctx,pt.x,pt.y,opts.size||10,'#c1121f');
    ctx.restore();
  }
};
function drawStar(ctx,x,y,size,color){
  ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI/2+i*Math.PI*2/5;
    const ix=x+Math.cos(a)*size,iy=y-Math.sin(a)*size;
    if(i===0)ctx.moveTo(ix,iy);else ctx.lineTo(ix,iy);
    const a2=a+Math.PI/5;
    ctx.lineTo(x+Math.cos(a2)*size*0.4,y-Math.sin(a2)*size*0.4);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
}
Chart.register(starPlugin);

function renderAnalytics(baseDay){
  const allRows=analyticsAllRows;
  if(!baseDay){
    let latest=null;
    Object.entries(allMonthData).forEach(([sheet,m])=>{
      m.parsedRows.forEach(r=>{
        if(r.total>0&&(!latest||r.date>latest.date))latest={...r,sheet,colIdx:m.colIdx,headers:m.headers};
      });
    });
    baseDay=latest;
  }
  if(!baseDay){$("alytBody").innerHTML='<div class="alytErr">매출 데이터가 없습니다</div>';return}

  const D=baseDay.date,DT=D.getTime();
  const dowK=DOWK[D.getDay()];
  const todayVal=baseDay.total;

  // 메트릭 계산
  const lwk=findRow(allRows,addDays(D,-7));
  const lmo=findRow(allRows,addDays(D,-28));
  // X요일 평균 = 전체 데이터의 같은 요일 평균
  const sameDowAll=allRows.filter(r=>r.date.getDay()===D.getDay()&&r.date.getTime()!==DT);
  const dowAvg=sameDowAll.length?sameDowAll.reduce((s,r)=>s+r.total,0)/sameDowAll.length:0;
  const ly=findRow(allRows,addDays(D,-364));
  const{week:wkNum}=getISOWeek(D);

  function findYearDay(yr){
    const m=getMondayOfWeek(yr,wkNum);
    const offset=D.getDay()===0?6:D.getDay()-1;
    return findRow(allRows,addDays(m,offset));
  }
  const y2023=findYearDay(2023),y2022=findYearDay(2022),y2021=findYearDay(2021);

  function calc(target){
    if(!target||!target.total)return null;
    return{pct:((todayVal-target.total)/target.total)*100,amt:target.total};
  }
  const m_lwk=calc(lwk),m_lmo=calc(lmo);
  const m_dowAvg=dowAvg?{pct:((todayVal-dowAvg)/dowAvg)*100,amt:dowAvg}:null;
  const m_ly=calc(ly),m_y23=calc(y2023),m_y22=calc(y2022),m_y21=calc(y2021);

  function metricRow(label,m,dim){
    if(!m)return`<div class="mItem"><div class="mL ${dim?'dim':''}">${label}</div><div class="mR"><span class="mNd">데이터 없음</span></div></div>`;
    return`<div class="mItem"><div class="mL ${dim?'dim':''}">${label}</div><div class="mR"><span class="mPct ${pctClass(m.pct)}">${pctText(m.pct)}</span><span class="mAmt">(${fmtK(m.amt)})</span></div></div>`;
  }

  // 가능한 날짜 범위 (input min/max)
  const minDate=allRows.length?isoStr(allRows.reduce((a,r)=>r.date<a?r.date:a,allRows[0].date)):"";
  const maxDate=allRows.length?isoStr(allRows.reduce((a,r)=>r.date>a?r.date:a,allRows[0].date)):"";

  $("alytBody").innerHTML=`
    <div class="heroBar">
      <div>
        <div class="hbT">기준일</div>
        <div class="hbD">
          <input type="date" id="baseDate" class="hbInput" value="${isoStr(D)}" min="${minDate}" max="${maxDate}">
          <span class="hbDow">(${dowK})</span>
        </div>
      </div>
      <div class="hbV">${fmt(todayVal)}</div>
    </div>

    <div class="topGrid">
      <div class="payCard">
        <h3>오늘 결제수단 비율</h3>
        <div class="payToday">${fmtK(todayVal)}</div>
        <div class="payBox"><canvas id="cPay"></canvas></div>
      </div>
      <div class="metricCard">
        <h3>비교 메트릭</h3>
        <div class="mList">
          ${metricRow("지난주 동일요일 대비",m_lwk)}
          ${metricRow("저번달 동일요일 대비",m_lmo)}
          ${metricRow(dowK+"요일 평균 대비",m_dowAvg)}
          ${metricRow("작년 동일요일 대비",m_ly,true)}
          ${metricRow("2023년 동일요일",m_y23,true)}
          ${metricRow("2022년 동일요일",m_y22,true)}
          ${metricRow("2021년 동일요일",m_y21,true)}
        </div>
      </div>
    </div>

    <div class="chartCard">
      <h3>저번주 비교<span id="lwkCum" class="cumul">누적 -</span></h3>
      <div class="ch3sub">월~기준일까지의 누적 비교, ⭐ = 기준일</div>

    </div>

    <div class="chartCard">
      <h3>작년 동일주 비교<span id="lyWkPct" class="cumul">누적 -</span></h3>

      <div class="chartBox"><canvas id="cLastYearWeek"></canvas></div>
    </div>

      <h3>작년 비교<span id="lyAcPct" class="cumul">누적 -</span></h3>
      <div class="ch3sub">1월 1일 ~ 기준일까지 누적 매출 (올해 vs 작년)</div>
      <div class="chartBox tall"><canvas id="cLastYearAccum"></canvas></div>
    </div>

    <div class="chartCard">
      <h3>연도별 오늘 비교</h3>
      <div class="ch3sub">기준일과 같은 주차의 같은 요일 매출 (연도별)</div>
      <div class="chartBox"><canvas id="cYearToday"></canvas></div>
    </div>

      <h3>연도별 주차별 매출</h3>
      <div class="ch3sub">매년 1주~52주의 주간 합계 (현재 연도 진하게)</div>
      <div class="chartBox tall"><canvas id="cYearWeek"></canvas></div>
    </div>
  `;

  // 달력으로 기준일 변경
  $("baseDate").addEventListener("change",e=>{
    const v=e.target.value;
    if(!v)return;
    const parts=v.split("-");
    const nd=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
    nd.setHours(0,0,0,0);
    const target=findRow(allRows,nd);
    if(!target){
      alert(`${v} 매출 데이터가 없습니다`);
      e.target.value=isoStr(D);
      return;
    }
    let sheet,colIdx,headers;
    for(const[k,m] of Object.entries(allMonthData)){
      if(m.parsedRows.some(r=>r.date.getTime()===nd.getTime())){
        sheet=k;colIdx=m.colIdx;headers=m.headers;break;
      }
    }
    renderAnalytics({...target,sheet,colIdx,headers});
  });

  drawPayChart(baseDay);
  drawLastWeekChart(allRows,baseDay);
  drawLastYearWeekChart(allRows,baseDay);
  drawLastYearAccumChart(allRows,baseDay);
  drawYearTodayChart(allRows,baseDay,wkNum);
  drawYearWeekChart(allRows,baseDay);
}

function drawLastWeekChart(allRows,latest){
  const D=latest.date;
  const dow=D.getDay();
  const monThis=addDays(D,dow===0?-6:-(dow-1));
  const monLast=addDays(monThis,-7);
  const dayOffset=dow===0?6:dow-1; // 월=0...일=6 (기준일 월요일부터의 인덱스)

  const labels=[],thisVals=[],lastVals=[],thisDates=[],lastDates=[];
  let starIdx=-1,sumThis=0,sumLast=0;
  for(let i=0;i<7;i++){
    const dThis=addDays(monThis,i),dLast=addDays(monLast,i);
    labels.push(`${dThis.getMonth()+1}/${dThis.getDate()}\n(${DOWK[dThis.getDay()]})`);
    thisDates.push(shortDate(dThis));
    lastDates.push(shortDate(dLast));
    const rT=findRow(allRows,dThis),rL=findRow(allRows,dLast);

    lastVals.push(rL&&rL.total>0?rL.total:null);
    if(dThis.getTime()===D.getTime())starIdx=i;
    if(i<=dayOffset){

      if(rL)sumLast+=rL.total;

  const cumPct=sumLast?((sumThis-sumLast)/sumLast)*100:null;

  destroyChart("lw");
  chartInstances.lw=new Chart(document.getElementById("cLastWeek"),{
    type:"line",
    data:{labels,datasets:[
      {label:"이번주",data:thisVals,dates:thisDates,borderColor:"#2d6a4f",backgroundColor:"rgba(45,106,79,0.08)",borderWidth:2.5,tension:0.3,pointRadius:3,spanGaps:true},

        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},

function drawLastYearAccumChart(allRows,latest){
  const D=latest.date;
  const yr=D.getFullYear();
  const start=new Date(yr,0,1);
  const startLY=new Date(yr-1,0,1);
  const endLY=new Date(yr-1,D.getMonth(),D.getDate());

  function buildAccum(s,e){
    let sum=0;const arr=[];const d=new Date(s);
    while(d<=e){
      const r=findRow(allRows,d);
      if(r&&r.total>0)sum+=r.total;
      arr.push({date:new Date(d),sum});
      d.setDate(d.getDate()+1);
    }
    return arr;
  }
  const accThis=buildAccum(start,D);
  const accLY=buildAccum(startLY,endLY);

  const labels=accThis.map(x=>`${x.date.getMonth()+1}/${x.date.getDate()}`);
  const thisData=accThis.map(x=>x.sum);
  const lyData=accLY.map(x=>x.sum);
  const thisDates=accThis.map(x=>shortDate(x.date));
  const lyDates=accLY.map(x=>shortDate(x.date));
  while(lyData.length<thisData.length){lyData.push(null);lyDates.push("")}

  const finalThis=thisData[thisData.length-1]||0;
  const finalLY=accLY.length?accLY[accLY.length-1].sum:0;
  const cumPct=finalLY?((finalThis-finalLY)/finalLY)*100:null;
  const el=$("lyAcPct");
  if(el){
    if(cumPct!==null){el.textContent=`${shortDate(D)}까지 연간 누적 ${pctText(cumPct)}`;el.className=`cumul ${pctClass(cumPct)}`}
    else{el.textContent="작년 데이터 없음";el.className="cumul"}
  }

  const starIdx=thisData.length-1;

  destroyChart("lya");
  chartInstances.lya=new Chart(document.getElementById("cLastYearAccum"),{
    type:"line",
    data:{labels,datasets:[
      {label:yr+"년 누적",data:thisData,dates:thisDates,borderColor:"#2d6a4f",backgroundColor:"rgba(45,106,79,0.1)",borderWidth:2.5,tension:0.2,pointRadius:0,fill:false},
      {label:(yr-1)+"년 누적",data:lyData,dates:lyDates,borderColor:"#9e8865",backgroundColor:"rgba(158,136,101,0.05)",borderWidth:2,tension:0.2,pointRadius:0,borderDash:[4,4],fill:false}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},
        tooltip:{mode:"index",intersect:false,callbacks:{label:tooltipLabelWithDate}},
        starMarker:{point:starIdx,datasetIdx:0,size:11}
      },
      scales:{
        y:{beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:10},callback:v=>fmtK(v)}},
        x:{ticks:{font:{family:"Pretendard,sans-serif",size:9},maxTicksLimit:12,autoSkip:true}}
      }
    }
  });
}

function drawYearWeekChart(allRows,latest){
  const yearWeekMap={};
  allRows.forEach(r=>{
    const{year,week}=getISOWeek(r.date);
    if(!yearWeekMap[year])yearWeekMap[year]=new Array(54).fill(null);
    if(yearWeekMap[year][week]===null)yearWeekMap[year][week]=0;
    yearWeekMap[year][week]+=r.total;
  });

  const years=Object.keys(yearWeekMap).map(Number).sort();
  const labels=[];for(let i=1;i<=52;i++)labels.push(i+"주");
  const baseColor=[45,106,79];
  const datasets=years.map((y,i)=>{
    const rev=years.length-1-i;
    const op=rev===0?1:rev===1?0.55:rev===2?0.3:0.18;
    const w=rev===0?2.5:rev===1?2:1.5;
    return{
      label:y+"년",
      data:yearWeekMap[y].slice(1,53),
      borderColor:`rgba(${baseColor.join(",")},${op})`,
      backgroundColor:`rgba(${baseColor.join(",")},${op*0.08})`,
      borderWidth:w,tension:0.25,pointRadius:0,pointHoverRadius:4,spanGaps:false
    };
  });

  destroyChart("yw");
  chartInstances.yw=new Chart(document.getElementById("cYearWeek"),{
    type:"line",
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},
        tooltip:{mode:"index",intersect:false,callbacks:{label:c=>c.parsed.y?`${c.dataset.label}: ${fmt(c.parsed.y)}`:`${c.dataset.label}: -`}}
      },
      scales:{
        y:{beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:10},callback:v=>fmtK(v)}},
        x:{ticks:{font:{family:"Pretendard,sans-serif",size:9},maxTicksLimit:13,autoSkip:true}}
      }
    }
  });
}
</script>
</body>
</html>
