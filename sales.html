<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
:root{
  --warm:#f5f0eb;--card:#fff;--text:#1a1a1a;--sub:#666;--muted:#999;
  --border:#e0d8cf;--accent:#6b8e5a;--accent2:#a3b18a;--green:#2d6a4f;
  --red:#c1121f;--blue:#1e4d8c;--blight:#f0ebe4;--cream:#faf7f2;
  --hall:#e07856;--delivery:#1e4d8c;
  --sans:'Pretendard',system-ui,-apple-system,sans-serif;
  --serif:'Playfair Display',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--warm);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto}

/* ── HEADER (선결제장부와 동일) ── */
.hdr{background:var(--card);padding:16px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.hb{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:.02em;white-space:nowrap;flex-shrink:0}
.hr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hn{font-size:11px;color:var(--sub);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:540px){.hn{display:none}}
.ho{font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 9px;border-radius:999px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.curM{font-size:13px;font-weight:600;color:var(--sub)}
.htCenter{flex:1;text-align:center;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text)}

.tabBar{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 16px}
.tBtn{flex:1;max-width:200px;padding:12px 16px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--sans)}
.tBtn.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

/* 연도 탭 (1단계) */
.yrTabs{display:flex;gap:4px;padding:10px 16px 8px;background:var(--card);overflow-x:auto;-webkit-overflow-scrolling:touch}
.yrTabs::-webkit-scrollbar{display:none}
.yrTab{flex-shrink:0;padding:7px 16px;font-size:13px;font-weight:600;color:var(--sub);background:none;border:none;cursor:pointer;font-family:var(--sans);border-radius:999px;white-space:nowrap}
.yrTab:hover{color:var(--text);background:var(--blight)}
.yrTab.on{color:#fff;background:var(--accent)}

/* 월 칩 (2단계) */
.navWrap{display:flex;align-items:center;gap:8px;padding:6px 16px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.mchip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:11px;white-space:nowrap;cursor:pointer;font-family:var(--sans);color:var(--sub);flex-shrink:0}
.mchip:hover{background:var(--blight)}
.mchip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

.panel{display:none}
.panel.show{display:block}

.summary{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:720px){.summary{grid-template-columns:repeat(4,1fr)}}
.sCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.sCard.wide{grid-column:1/-1}
.sCard .sl{font-size:11px;color:var(--sub)}
.sCard .sv{font-size:18px;font-weight:700;font-family:var(--serif);margin-top:2px}
.sCard .sv.green{color:var(--green)}
.tWrap{padding:0 8px 100px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:11px;width:100%;min-width:900px}
th{background:var(--blight);border:1px solid var(--border);padding:7px 8px;text-align:center;font-weight:600;white-space:nowrap;color:var(--text);font-size:11px}
td{border:1px solid var(--border);padding:6px 8px;text-align:right;white-space:nowrap;background:var(--card)}
td:first-child,td:nth-child(2){text-align:center;font-weight:500}
tr:last-child td{font-weight:700;background:var(--blight)}
tr.holiday td{color:var(--red)}

.dbg{background:#fffbe5;border:1px solid #e8d97a;border-radius:8px;padding:10px 12px;margin:10px 16px;font-size:11px;font-family:monospace;color:#5a4f1a;white-space:pre-wrap;word-break:break-all;max-height:280px;overflow-y:auto}

.alyt{padding:14px;padding-bottom:100px}

.heroBar{background:linear-gradient(135deg,var(--cream),#fff);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.heroBar .hbT{font-size:11px;color:var(--sub);letter-spacing:.04em}
.heroBar .hbD{font-size:14px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
.heroBar .hbDow{font-size:13px;color:var(--sub);font-weight:500}
.heroBar .hbInput{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;font-family:var(--sans);background:#fff;cursor:pointer;color:var(--text);font-weight:500}
.heroBar .hbInput:hover{border-color:var(--accent)}
.heroBar .hbV{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}

.topGrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:680px){.topGrid{grid-template-columns:280px 1fr}}

.payCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.payCard h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px}
.payToday{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px}
.payBox{position:relative;height:200px;margin-bottom:8px}

/* 세부 바 (홀/배달 각각) */
.payDetail{margin-top:10px}
.payDetail .pdRow{margin-bottom:10px}
.payDetail .pdRow:last-child{margin-bottom:0}
.payDetail .pdLabel{font-size:11px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.payDetail .pdLabel .pdL{}
.payDetail .pdLabel .pdAmt{font-size:10px;color:var(--sub);font-weight:500;font-family:var(--serif)}
.payDetail .pdBar{height:18px;border-radius:4px;display:flex;overflow:hidden;background:var(--blight)}
.payDetail .pdSeg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;border-right:1px solid rgba(255,255,255,0.4)}
.payDetail .pdSeg:last-child{border-right:none}
.payDetail .pdLegend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:10px;color:var(--sub)}
.payDetail .pdLegend .pdLI{display:inline-flex;align-items:center;gap:4px}
.payDetail .pdLegend .pdSwatch{width:10px;height:10px;border-radius:2px;display:inline-block}

.metricCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.metricCard h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:10px}
.mList{display:flex;flex-direction:column;gap:0}
.mItem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--blight)}
.mItem:last-child{border-bottom:none}
.mItem .mL{font-size:12px;color:var(--text);font-weight:500}
.mItem .mL.dim{color:var(--muted);font-weight:400}
.mItem .mR{display:flex;align-items:center;gap:8px;font-size:12px}
.mItem .mPct{font-weight:700;font-family:var(--serif);font-size:14px}
.mItem .mPct.up{color:var(--red)}
.mItem .mPct.down{color:var(--blue)}
.mItem .mPct.neu{color:var(--muted)}
.mItem .mAmt{color:var(--sub);font-size:11px;font-family:var(--serif)}
.mItem .mNd{color:var(--muted);font-size:11px;font-style:italic}

.chartCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.chartCard h3{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.chartCard h3 .cumul{font-size:11px;font-weight:500;color:var(--sub);background:var(--blight);padding:3px 8px;border-radius:999px;font-family:var(--serif)}
.chartCard h3 .cumul.up{color:var(--red);background:#fdf0f0}
.chartCard h3 .cumul.down{color:var(--blue);background:#eef2f8}
.chartCard .ch3sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.chartBox{position:relative;height:240px}
.chartBox.tall{height:280px}

/* 비교 차트 + 옆에 누적 스택바 */
.compareGrid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:680px){.compareGrid{grid-template-columns:1fr}}
.compareGrid .cgLine{position:relative;height:240px}
.compareGrid .cgStack{position:relative;height:240px}

.yearChks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.yearChk{font-size:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);user-select:none}
.yearChk input{cursor:pointer;margin:0}
.yearChk:hover{background:var(--blight)}

.zoomHint{font-size:10px;color:var(--muted);margin-top:6px;text-align:right}

.alytLoad,.alytErr{text-align:center;padding:40px 20px;font-size:13px;color:var(--muted)}
.alytErr{color:var(--red)}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.err{text-align:center;padding:40px 20px;color:var(--red);font-size:13px}

@media(max-width:680px){
  .heroBar .hbV{font-size:20px}
  .metricCard{padding:12px 14px}
  .mItem .mL{font-size:11px}
  .mItem .mR{font-size:11px}
  .mItem .mPct{font-size:13px}
}
</style>

<script>
const SHEET_ID="13w8Z3XFM3EqGpx-YGuW4YIx5H9Qk4Z64Gu1jvT-siYw";
const API_KEY="AIzaSyAobLBmEc8I8zGJdpjOVQxX3_347TZNJJo";
const DEBUG=new URLSearchParams(location.search).get("debug")==="1";
const $=id=>document.getElementById(id);
const fmt=n=>{if(n===null||n===undefined||n==="")return"-";const v=Number(n);return isNaN(v)?""+n:"₩"+Math.round(v).toLocaleString()};
const fmtK=n=>{if(!n)return"₩0";if(n>=10000000)return"₩"+(n/10000000).toFixed(1)+"천만";if(n>=10000)return"₩"+(n/10000).toFixed(0)+"만";return"₩"+n.toLocaleString()};
const DOWK=["일","월","화","수","목","금","토"];

// 카테고리 라벨
const CATEGORY_LABELS=new Set(["홀","배달","결제","결제수단","합계","매출"]);
// 합계성 컬럼 (결제수단 비율에서 제외)
const TOTAL_COLS=new Set(["총 매출","총매출","vat","VAT","순매출","부가세"]);

// 시트는 4~34행이 데이터, 35행이 총매출 (1-indexed)
// 0-indexed로는 dataRows 인덱스 3~33, summary 34
const DATA_ROW_START=3; // 0-indexed
const DATA_ROW_END=33;  // inclusive
const SUMMARY_ROW=34;

function num(v){
  if(v===null||v===undefined)return 0;
  if(typeof v==="number")return isNaN(v)?0:v;
  if(typeof v==="string"){
    const c=v.replace(/[₩,원\s]/g,"").trim();
    if(!c||c==="-")return 0;
    const n=Number(c);
    return isNaN(n)?0:n;
  }
  return 0;
}

function txt(v){
  if(v===null||v===undefined)return "";
  if(typeof v==="number")return String(v);
  if(typeof v==="string")return v.trim();
  return String(v).trim();
}
function looksLikeData(s){
  if(typeof s!=="string")return false;
  const t=s.trim();
  if(!t)return false;
  if(/^[\d,₩원.\s-]+$/.test(t))return true;
  if(/^\d{1,2}\/\d{1,2}/.test(t))return true;
  if(/^\d{4}-\d{1,2}-\d{1,2}/.test(t))return true;
  if(/^\d{1,2}월\s*\d{1,2}일/.test(t))return true;
  return false;
}

// 헤더 행 (보통 row 2, 0-indexed)
function findHeaderIdx(rows){
  for(let i=0;i<Math.min(rows.length,5);i++){
    const r=rows[i];if(!r)continue;
    if(r.some(c=>typeof c==="string"&&c.trim()==="날짜"))return i;
  }
  return 1;
}

// 헤더 합치기: 카테고리 행 + 실제 헤더 행을 통합
function buildHeaders(rows,hIdx){
  const main=rows[hIdx]||[];
  const above=hIdx>0?(rows[hIdx-1]||[]):[];
  const below=hIdx+1<rows.length?(rows[hIdx+1]||[]):[];
  const len=Math.max(main.length,above.length,below.length);
  const out=[];
  for(let i=0;i<len;i++){
    const mTxt=txt(main[i]);
    const aTxt=txt(above[i]);
    const bTxt=txt(below[i]);
    if(mTxt&&CATEGORY_LABELS.has(mTxt)){
      if(aTxt&&!looksLikeData(aTxt)&&!CATEGORY_LABELS.has(aTxt)){out.push(aTxt);continue}
      if(bTxt&&!looksLikeData(bTxt)&&!CATEGORY_LABELS.has(bTxt)){out.push(bTxt);continue}
      out.push(mTxt); continue;
    }
    if(mTxt&&!looksLikeData(mTxt)){out.push(mTxt); continue}
    if(aTxt&&!looksLikeData(aTxt)&&!CATEGORY_LABELS.has(aTxt)){out.push(aTxt); continue}
    if(bTxt&&!looksLikeData(bTxt)&&!CATEGORY_LABELS.has(bTxt)){out.push(bTxt); continue}
    out.push("");
  }
  return out;
}

// "홀"/"배달" 카테고리 컬럼 위치 찾기
function findCategoryRanges(rows){
  let holIdx=-1,delIdx=-1;
  for(let r=0;r<Math.min(rows.length,5);r++){
    const row=rows[r];if(!row)continue;
    for(let i=0;i<row.length;i++){
      const t=txt(row[i]);
      if(t==="홀"&&holIdx<0)holIdx=i;
      else if(t==="배달"&&delIdx<0)delIdx=i;
    }
  }
  return{holIdx,delIdx};
}

// 행이 데이터인지 (날짜 형식)
function isDataRow(r){
  if(!r||!r.length)return false;
  const v=r[0];
  if(typeof v==="number"&&v>0)return true;
  if(typeof v==="string"){
    const t=v.trim();
    if(/^\d{4}-\d{1,2}-\d{1,2}/.test(t))return true;
    if(/^\d{1,2}\/\d{1,2}/.test(t))return true;
    if(/^\d{1,2}월\s*\d{1,2}일/.test(t))return true;
  }
  return false;
}

// 행에서 총매출 가져오기 (없으면 vat+순매출 fallback)
function getRowTotal(r,ci){
  let v=num(r[ci.total]);
  if(v>0)return v;
  const vat=num(r[ci.vat]);
  const net=num(r[ci.net]);
  if(net>0&&vat>=0)return vat+net;
  if(vat>0)return Math.round(vat*10);
  return 0;
}

// 홀/배달 합계 (카테고리 기반)
function calcHallSum(r,catRanges,headers){
  const{holIdx,delIdx}=catRanges;
  if(holIdx<0)return 0;
  const start=holIdx;
  const end=delIdx>0?delIdx-1:r.length-1;
  let sum=0;
  for(let i=start;i<=end;i++){
    if(headers&&TOTAL_COLS.has(txt(headers[i])))continue;
    sum+=num(r[i]);
  }
  return sum;
}
function calcDeliverySum(r,catRanges,headers){
  const{delIdx}=catRanges;
  if(delIdx<0)return 0;
  let sum=0;
  for(let i=delIdx;i<r.length;i++){
    if(headers&&TOTAL_COLS.has(txt(headers[i])))continue;
    sum+=num(r[i]);
  }
  return sum;
}

const au=firebase.auth();
au.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

au.onAuthStateChanged(u=>{
  if(!u){
    $("content").className="err";
    $("content").innerHTML='⚠️ 로그인 정보가 없습니다.<br><br><a href="index.html" style="color:var(--accent);text-decoration:underline">← 메인으로</a>';

  $("uN").textContent=u.displayName||u.email||"";

let allSheets=[],currentSheet=null,sheetCache={},alytLoaded=false;
let sheetsByYear={},currentYear=null;

async function init(){
  const metaUrl=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}&fields=sheets.properties`;
  const res=await fetch(metaUrl);
  if(!res.ok){$("content").className="err";$("content").textContent="시트 접근 실패: "+res.status;return}
  const meta=await res.json();
  allSheets=meta.sheets.map(s=>s.properties.title).filter(t=>/\d{4}-\d{2}월/.test(t)).sort();
  if(!allSheets.length){$("content").className="err";$("content").textContent="매출보고 시트 탭을 찾을 수 없습니다";return}

  // 연도별 그룹
  sheetsByYear={};
  allSheets.forEach(name=>{
    const m=name.match(/(\d{4})-(\d{2})월/);
    if(!m)return;
    const yr=m[1];
    if(!sheetsByYear[yr])sheetsByYear[yr]=[];
    sheetsByYear[yr].push(name);
  });

  renderYearTabs();

  // 가장 최근 시트로 진입
  const latest=allSheets[allSheets.length-1];
  const ym=latest.match(/(\d{4})-(\d{2})월/);
  currentYear=ym[1];
  renderMonthChips();
  loadSheet(latest);
}

function renderYearTabs(){
  const yrs=Object.keys(sheetsByYear).sort();
  const wrap=$("yrTabs");
  wrap.innerHTML="";
  yrs.forEach(yr=>{
    const btn=document.createElement("button");
    btn.className="yrTab";
    btn.textContent=yr+"년";
    btn.dataset.year=yr;
    btn.addEventListener("click",()=>{
      currentYear=yr;
      const months=sheetsByYear[yr];
      renderMonthChips();
      loadSheet(months[months.length-1]);
    });
    wrap.appendChild(btn);
  });
  setTimeout(()=>wrap.scrollLeft=wrap.scrollWidth,50);
}

function renderMonthChips(){
  const wrap=$("mNav");
  wrap.innerHTML="";
  document.querySelectorAll(".yrTab").forEach(b=>b.classList.toggle("on",b.dataset.year===currentYear));

// 시트 파싱: 4~34행이 데이터, 35행이 총매출 (1-indexed)
// 단 행이 그보다 적으면 그 만큼만 (예: 30일 월)
function parseSheet(rows){
  const hIdx=findHeaderIdx(rows);
  const headers=buildHeaders(rows,hIdx);
  const catRanges=findCategoryRanges(rows);
  // 0-indexed로 DATA_ROW_START=3 (4행), DATA_ROW_END=33 (34행), SUMMARY=34 (35행)
  // 단 행 부족하면 가능한 만큼
  const lastIdx=Math.min(rows.length-1,DATA_ROW_END);
  let dataRows=[];
  for(let i=DATA_ROW_START;i<=lastIdx;i++){
    const r=rows[i];
    if(r&&isDataRow(r))dataRows.push(r);
  }
  // 총매출 행: 정확히 SUMMARY_ROW(35행) 또는 첫 셀에 "총매출" 있는 행
  let summaryRow=null;
  if(rows[SUMMARY_ROW]&&typeof rows[SUMMARY_ROW][0]==="string"&&rows[SUMMARY_ROW][0].includes("총매출")){
    summaryRow=rows[SUMMARY_ROW];
  }else{
    // fallback: 마지막 5행 안에서 "총매출" 찾기
    for(let i=Math.min(rows.length-1,SUMMARY_ROW+5);i>=Math.max(DATA_ROW_END,0);i--){
      if(rows[i]&&typeof rows[i][0]==="string"&&rows[i][0].includes("총매출")){
        summaryRow=rows[i];break;
      }
    }
  }
  return{hIdx,headers,catRanges,dataRows,summaryRow};
}

async function loadSheet(name){
  currentSheet=name;
  // 다른 연도의 시트로 점프한 경우 currentYear 동기화 + 월칩 재렌더
  const sm=name.match(/(\d{4})-(\d{2})월/);
  if(sm&&sm[1]!==currentYear){
    currentYear=sm[1];
    renderMonthChips();
  }
  document.querySelectorAll(".mchip").forEach(c=>c.classList.toggle("on",c.dataset.sheet===name));
  $("curMonth").textContent=sm?`매출 보고 · ${sm[1]}년 ${parseInt(sm[2])}월`:"매출 보고";
  $("content").className="loading";$("content").innerHTML="데이터를 불러오는 중...";
  $("sumArea").style.display="none";
  $("dbgArea").style.display="none";

  let data;
  if(sheetCache[name]){data=sheetCache[name]}
  else{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(name)}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
    const res=await fetch(url);
    if(!res.ok){$("content").className="err";$("content").textContent="데이터 로드 실패: "+res.status;return}
    data=await res.json();
    sheetCache[name]=data;
  }
  const rows=data.values||[];
  if(rows.length<2){$("content").className="err";$("content").textContent="데이터가 없습니다";return}

  const parsed=parseSheet(rows);

  if(DEBUG){
    const dbg=$("dbgArea");
    dbg.style.display="block";
    dbg.textContent=
      `[DEBUG] sheet: ${name}\n`+
      `rows.length: ${rows.length}\n`+
      `hIdx: ${parsed.hIdx}\n`+
      `catRanges: ${JSON.stringify(parsed.catRanges)}\n`+
      `merged headers: ${JSON.stringify(parsed.headers)}\n`+
      `dataRows count: ${parsed.dataRows.length}\n`+
      `first dataRow: ${JSON.stringify(parsed.dataRows[0]||[])}\n`+
      `last dataRow: ${JSON.stringify(parsed.dataRows[parsed.dataRows.length-1]||[])}\n`+
      `summaryRow: ${JSON.stringify(parsed.summaryRow||[])}`;
  }

  renderSummary(parsed);
  renderTable(parsed);
}

function getColIdx(headers){
  const idx={};
  headers.forEach((h,i)=>{
    const k=(""+h).trim();
    if(k&&!(k in idx))idx[k]=i;
  });
  return{
    total:idx["총 매출"]??idx["총매출"]??2,
    vat:idx["vat"]??idx["VAT"]??idx["부가세"]??3,
    net:idx["순매출"]??4,
    card:idx["카드매출"]??idx["카드"]??5,
    cash:idx["현금 매출"]??idx["현금매출"]??idx["현금"]??6,
    toss:idx["간편결제(토스페이)"]??idx["간편결제"]??idx["제로페이"]??7,
    prepay:idx["선결제(차감)"]??idx["선결제차감"]??8,
    seoul:idx["서울페이"]??9
  };
}

function renderTable(parsed){
  const{headers,dataRows,summaryRow}=parsed;
  let html='<table><thead><tr>';
  headers.forEach(h=>html+=`<th>${h||""}</th>`);
  html+='</tr></thead><tbody>';
  dataRows.forEach(r=>{
    const dow=r[1]||"";
    const isHoliday=dow==="일"||dow==="토";
    html+=`<tr${isHoliday?' class="holiday"':''}>`;
    headers.forEach((h,i)=>{
      let v=r[i]??"";
      if(i===0&&typeof v==="number"){
        const d=new Date((v-25569)*86400000);
        v=`${d.getMonth()+1}/${d.getDate()}`;
      }else if(i===0&&typeof v==="string"&&v.includes("-")){
        const parts=v.split("-");
        if(parts.length>=3)v=`${parseInt(parts[1])}/${parseInt(parts[2])}`;
      }
      if(i>=2){
        const n=num(v);
        if(n)v="₩"+n.toLocaleString();
        else if(v===""||v===0||v==="-"||v===null||v===undefined)v="-";
        else v=String(v);
      }
      html+=`<td>${v}</td>`;
    });
    html+='</tr>';
  });
  if(summaryRow){
    html+='<tr>';
    headers.forEach((h,i)=>{
      let v=summaryRow[i]??"";
      if(i>=2){
        const n=num(v);
        if(n)v="₩"+n.toLocaleString();
        else v="-";
      }
      html+=`<td>${v}</td>`;
    });
    html+='</tr>';
  }
  html+='</tbody></table>';
  $("content").className="tWrap";
  $("content").innerHTML=html;
}

async function loadAnalytics(){
  $("alytBody").innerHTML='<div class="alytLoad">분석 데이터를 불러오는 중... (시트 '+allSheets.length+'개)</div>';
  const ranges=allSheets.map(n=>`ranges=${encodeURIComponent(n)}`).join("&");
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchGet?${ranges}&key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
  const res=await fetch(url);
  if(!res.ok){$("alytBody").innerHTML='<div class="alytErr">데이터 로드 실패: '+res.status+'</div>';return}
  const data=await res.json();
  if(!data.valueRanges){$("alytBody").innerHTML='<div class="alytErr">데이터 형식 오류</div>';return}

  data.valueRanges.forEach((vr,idx)=>{
    const name=allSheets[idx];
    const rows=vr.values||[];
    if(rows.length<2)return;
    const parsed=parseSheet(rows);
    const ci=getColIdx(parsed.headers);
    const parsedRows=parsed.dataRows.map(r=>{
      let dt=null;
      const v=r[0];
      if(typeof v==="number"){dt=new Date((v-25569)*86400000)}
      else if(typeof v==="string"){
        const t=v.trim();
        if(t.includes("-")){
          const parts=t.split("-");
          if(parts.length>=3)dt=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
        }else if(t.includes("/")){
          const ym=name.match(/(\d{4})-(\d{2})/);
          if(ym){
            const parts=t.split("/");
            if(parts.length>=2)dt=new Date(parseInt(ym[1]),parseInt(parts[0])-1,parseInt(parts[1]));
          }
        }
      }
      if(dt&&!isNaN(dt))dt.setHours(0,0,0,0);
      const total=getRowTotal(r,ci);
      const hall=calcHallSum(r,parsed.catRanges,parsed.headers);
      const delivery=calcDeliverySum(r,parsed.catRanges,parsed.headers);
      return{date:dt,dow:r[1]||"",total,hall,delivery,raw:r};
    }).filter(r=>r.date&&!isNaN(r.date));
    allMonthData[name]={headers:parsed.headers,catRanges:parsed.catRanges,parsedRows,colIdx:ci};
  });

  analyticsAllRows=Object.values(allMonthData).flatMap(m=>m.parsedRows).filter(r=>r.total>0);
  alytLoaded=true;
  renderAnalytics();
}

function addDays(d,n){const x=new Date(d);x.setDate(d.getDate()+n);return x}
function findRow(rows,d){const t=d.getTime();return rows.find(r=>r.date.getTime()===t)}
function pctClass(p){return p>0?'up':p<0?'down':'neu'}
function pctText(p){if(p===null||!isFinite(p))return'-';return(p>=0?'△ ':'▽ ')+Math.abs(p).toFixed(1)+'%'}
function isoStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function shortDate(d){return `${d.getMonth()+1}/${d.getDate()} (${DOWK[d.getDay()]})`}

function getISOWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return{year:t.getUTCFullYear(),week:Math.ceil(((t-ys)/86400000+1)/7)}
}
function getMondayOfWeek(year,week){
  const jan4=new Date(Date.UTC(year,0,4));
  const jan4Dow=jan4.getUTCDay()||7;
  const monday=new Date(jan4);monday.setUTCDate(jan4.getUTCDate()-(jan4Dow-1)+(week-1)*7);
  return new Date(monday.getUTCFullYear(),monday.getUTCMonth(),monday.getUTCDate());
}

const starPlugin={
  id:'starMarker',
  afterDatasetsDraw(chart,args,opts){
    if(!opts||opts.point===undefined||opts.point<0)return;
    const{ctx}=chart;
    const meta=chart.getDatasetMeta(opts.datasetIdx??0);
    const pt=meta.data[opts.point];
    if(!pt)return;
    ctx.save();
    drawStar(ctx,pt.x,pt.y,opts.size||10,'#c1121f');
    ctx.restore();
  }
};
function drawStar(ctx,x,y,size,color){
  ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI/2+i*Math.PI*2/5;
    const ix=x+Math.cos(a)*size,iy=y-Math.sin(a)*size;
    if(i===0)ctx.moveTo(ix,iy);else ctx.lineTo(ix,iy);
    const a2=a+Math.PI/5;
    ctx.lineTo(x+Math.cos(a2)*size*0.4,y-Math.sin(a2)*size*0.4);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
}
Chart.register(starPlugin);

      type:"doughnut",
      data:{
        labels:["홀","배달"],
        datasets:[{data:[hallSum,delSum],backgroundColor:["#e07856","#1e4d8c"],borderWidth:2,borderColor:"#fff"}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{
            position:"bottom",
            labels:{
              font:{family:"Pretendard,sans-serif",size:11},boxWidth:10,padding:8,
              generateLabels:(chart)=>{
                const sum=chart.data.datasets[0].data.reduce((s,v)=>s+v,0);
                return chart.data.labels.map((label,i)=>{
                  const val=chart.data.datasets[0].data[i];
                  const pct=sum?(val/sum*100).toFixed(1):"0.0";
                  return{
                    text:`${label} ${pct}%`,
                    fillStyle:chart.data.datasets[0].backgroundColor[i],
                    strokeStyle:chart.data.datasets[0].backgroundColor[i],
                    lineWidth:0,index:i
                  };
                });
              }
            }
          },
          tooltip:{callbacks:{label:c=>{
            const sum=c.dataset.data.reduce((s,v)=>s+v,0);
            const pct=sum?(c.parsed/sum*100).toFixed(1):0;
            return `${c.label}: ₩${c.parsed.toLocaleString()} (${pct}%)`;
          }}}
        },
        cutout:"55%"
      }
    });
  }

  // 세부 바
  function buildItems(startIdx,endIdx,colors){
    const items=[];
    let ci=0;
    for(let i=startIdx;i<=endIdx&&i<headers.length;i++){
      const h=txt(headers[i]);
      if(!h||TOTAL_COLS.has(h)||CATEGORY_LABELS.has(h))continue;
      const v=num(r[i]);
      if(v<=0)continue;
      items.push({label:h,val:v,color:colors[ci%colors.length]});
      ci++;
    }
    return items;
  }
  const hallColors=["#e07856","#c4655a","#9e6850","#d77a5e","#a85540","#7a4530"];
  const delColors=["#1e4d8c","#3a6ba8","#5fa8d3","#5a8aa6","#365e94","#7baacc"];

  let hallItems=[],delItems=[];
  if(catRanges.holIdx>=0){
    const hEnd=catRanges.delIdx>0?catRanges.delIdx-1:headers.length-1;
    hallItems=buildItems(catRanges.holIdx,hEnd,hallColors);
  }
  if(catRanges.delIdx>=0){
    delItems=buildItems(catRanges.delIdx,headers.length-1,delColors);
  }

  function renderBar(items,labelText,totalVal){
    if(!items.length)return "";
    const sum=items.reduce((s,x)=>s+x.val,0);
    if(sum<=0)return "";
    const segs=items.map(it=>{
      const pct=sum?(it.val/sum*100):0;
      const txt=pct>=8?`${it.label} ${pct.toFixed(0)}%`:'';
      return `<div class="pdSeg" style="background:${it.color};width:${pct}%" title="${it.label}: ₩${it.val.toLocaleString()} (${pct.toFixed(1)}%)">${txt}</div>`;
    }).join("");
    const legend=items.map(it=>{
      const pct=sum?(it.val/sum*100).toFixed(1):0;
      return `<span class="pdLI"><span class="pdSwatch" style="background:${it.color}"></span>${it.label} ${pct}%</span>`;
    }).join("");
    return `<div class="pdRow">
      <div class="pdLabel"><span class="pdL">${labelText}</span><span class="pdAmt">${fmtK(sum)}</span></div>
      <div class="pdBar">${segs}</div>
      <div class="pdLegend">${legend}</div>
    </div>`;
  }

  $("payDetail").innerHTML=
    renderBar(hallItems,"홀 매출 세부",hallSum)+
    renderBar(delItems,"배달 매출 세부",delSum);
}

// 비교 차트: 라인(2/3) + 누적 스택바(1/3)
function drawCompareCharts(allRows,latest,daysOffset,thisLabel,otherLabel,otherColor,cumElId,lineCanvasId,stackCanvasId,lineKey,stackKey){
  const D=latest.date;
  const dow=D.getDay();
  const monThis=addDays(D,dow===0?-6:-(dow-1));
  const monOther=addDays(monThis,daysOffset);
  const dayOffset=dow===0?6:dow-1;

  const labels=[],thisVals=[],otherVals=[],thisDates=[],otherDates=[];
  let starIdx=-1;
  let sumThisHall=0,sumThisDel=0,sumOtherHall=0,sumOtherDel=0;
  let sumThisTotal=0,sumOtherTotal=0;

  for(let i=0;i<7;i++){
    const dThis=addDays(monThis,i),dOther=addDays(monOther,i);
    labels.push(`${dThis.getMonth()+1}/${dThis.getDate()}\n(${DOWK[dThis.getDay()]})`);
    thisDates.push(shortDate(dThis));
    otherDates.push(shortDate(dOther));
    const rT=findRow(allRows,dThis),rO=findRow(allRows,dOther);
    thisVals.push(rT&&rT.total>0?rT.total:null);
    otherVals.push(rO&&rO.total>0?rO.total:null);
    if(dThis.getTime()===D.getTime())starIdx=i;
    if(i<=dayOffset){
      if(rT){sumThisHall+=rT.hall;sumThisDel+=rT.delivery;sumThisTotal+=rT.total}
      if(rO){sumOtherHall+=rO.hall;sumOtherDel+=rO.delivery;sumOtherTotal+=rO.total}
    }
  }
  const cumPct=sumOtherTotal?((sumThisTotal-sumOtherTotal)/sumOtherTotal)*100:null;
  const el=$(cumElId);
  const dowKr=DOWK[D.getDay()];
  if(el){
    if(cumPct!==null){el.textContent=`${dowKr}요일까지 누적 ${pctText(cumPct)}`;el.className=`cumul ${pctClass(cumPct)}`}
    else el.textContent=`${dowKr}요일까지 누적 -`;
  }

  // 라인 차트
  destroyChart(lineKey);
  chartInstances[lineKey]=new Chart(document.getElementById(lineCanvasId),{
    type:"line",
    data:{labels,datasets:[
      {label:thisLabel,data:thisVals,dates:thisDates,borderColor:"#2d6a4f",backgroundColor:"rgba(45,106,79,0.08)",borderWidth:2.5,tension:0.3,pointRadius:3,spanGaps:true},
      {label:otherLabel,data:otherVals,dates:otherDates,borderColor:otherColor,backgroundColor:otherColor+"15",borderWidth:2,tension:0.3,pointRadius:3,spanGaps:true,borderDash:[4,4]}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},
        tooltip:{callbacks:{label:tooltipLabelWithDate}},
        starMarker:{point:starIdx,datasetIdx:0,size:9}
      },
      scales:{
        y:{beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:10},callback:v=>fmtK(v)}},
        x:{ticks:{font:{family:"Pretendard,sans-serif",size:10}}}
      }
    }
  });

  // 누적 스택바: 옆에 [other, this] 두 막대, 각각 홀/배달 적층
  destroyChart(stackKey);
  const stackCtx=document.getElementById(stackCanvasId);
  if(!stackCtx)return;

  const stackLabels=[otherLabel,thisLabel];
  // 누적 합계 (월~기준요일까지)
  const hallVals=[sumOtherHall,sumThisHall];
  const delVals=[sumOtherDel,sumThisDel];
  const totals=[sumOtherTotal,sumThisTotal];

  // % 데이터 (각 막대를 100%로 표시할지, 절대값으로 할지) → 절대값으로 두고 라벨로 % 표시
  chartInstances[stackKey]=new Chart(stackCtx,{
    type:"bar",
    data:{
      labels:stackLabels,
      datasets:[
        {label:"홀",data:hallVals,backgroundColor:"#e07856",stack:"a",borderRadius:{topLeft:0,topRight:0,bottomLeft:6,bottomRight:6},borderSkipped:false},
        {label:"배달",data:delVals,backgroundColor:"#1e4d8c",stack:"a",borderRadius:{topLeft:6,topRight:6,bottomLeft:0,bottomRight:0},borderSkipped:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},
        title:{display:true,text:`${dowKr}요일까지 누적 (홀/배달)`,font:{family:"Pretendard,sans-serif",size:11,weight:"600"},color:"#666",padding:{bottom:6}},
        tooltip:{
          callbacks:{
            label:c=>{
              const totalForBar=totals[c.dataIndex]||0;
              const pct=totalForBar?(c.parsed.y/totalForBar*100).toFixed(1):0;
              return `${c.dataset.label}: ${fmt(c.parsed.y)} (${pct}%)`;
            },
            footer:(items)=>{
              if(!items.length)return "";
              const idx=items[0].dataIndex;
              return `합계: ${fmt(totals[idx])}`;
            }
          }
        },
        // 데이터 라벨 (% 표시)
        datalabels:false
      },
      scales:{
        x:{stacked:true,ticks:{font:{family:"Pretendard,sans-serif",size:10}}},
        y:{stacked:true,beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:9},callback:v=>fmtK(v)}}
      }
    },
    plugins:[{
      id:'stackPctLabels',
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        ctx.save();
        ctx.font='600 10px Pretendard,sans-serif';
        ctx.fillStyle='#fff';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        chart.data.datasets.forEach((dataset,dsIdx)=>{
          const meta=chart.getDatasetMeta(dsIdx);
          meta.data.forEach((bar,i)=>{
            const total=totals[i]||0;
            const val=dataset.data[i]||0;
            if(!total||!val)return;
            const pct=val/total*100;
            if(pct<10)return; // 너무 작으면 안 그림
            const{x,y,base}=bar;
            const cy=(y+base)/2;
            ctx.fillText(`${pct.toFixed(0)}%`,x,cy);
          });
        });
        ctx.restore();
      }
    }]
  });
}

function drawAccumChart(allRows,baseDay){
  const D=baseDay.date;
  const yearsAvail=[...new Set(allRows.map(r=>r.date.getFullYear()))].sort();
  const baseYear=D.getFullYear();
  const colorPalette=["#2d6a4f","#9e8865","#5fa8d3","#c4a77d","#7a9050","#e07856","#8a5a5a","#5a8a8a"];
  const colors={};
  yearsAvail.slice().sort((a,b)=>b-a).forEach((yr,i)=>{colors[yr]=colorPalette[i%colorPalette.length]});

  const chksDiv=$("yearChks");
  chksDiv.innerHTML=yearsAvail.map(yr=>{
    const checked=(yr===baseYear||yr===baseYear-1)?"checked":"";
    return `<label class="yearChk">
      <input type="checkbox" data-year="${yr}" ${checked} style="accent-color:${colors[yr]}">
      <span style="color:${colors[yr]};font-weight:600">${yr}년</span>
    </label>`;
  }).join("");

  // X축: 1/1 ~ 12/31 고정
  const labels=[];
  for(let m=0;m<12;m++){
    const lastDay=new Date(2001,m+1,0).getDate();
    for(let d=1;d<=lastDay;d++)labels.push(`${m+1}/${d}`);
  }

  function buildSeries(yr){
    let sum=0;const arr=[];
    const start=new Date(yr,0,1);
    const end=new Date(yr,11,31);
    const d=new Date(start);
    const today=new Date();today.setHours(0,0,0,0);
    while(d<=end){
      // 미래 날짜는 null
      if(d>today){arr.push(null);d.setDate(d.getDate()+1);continue}
      const r=findRow(allRows,d);
      if(r&&r.total>0)sum+=r.total;
      arr.push(sum);
      d.setDate(d.getDate()+1);
    }
    return arr;
  }

  // 기준일 위치 (1/1부터 며칠째 인덱스)
  function baseDayIdx(yr){
    if(yr!==baseYear)return -1;
    const start=new Date(yr,0,1);
    return Math.floor((D-start)/86400000);
  }

  function render(){
    const checked=Array.from(document.querySelectorAll("#yearChks input:checked")).map(c=>parseInt(c.dataset.year)).sort((a,b)=>b-a);
    const datasets=checked.map((yr)=>{
      const data=buildSeries(yr);
      while(data.length<labels.length)data.push(null);
      const isBase=yr===baseYear;
      return{
        label:yr+"년",
        data,
        borderColor:colors[yr],
        backgroundColor:colors[yr]+"15",
        borderWidth:isBase?2.5:1.8,
        tension:0.2,
        pointRadius:0,
        fill:false,
        borderDash:isBase?[]:[3,3]
      };
    });

    // 기준일에 별 표시 (baseYear 데이터셋의 해당 인덱스)
    const baseDsIdx=checked.indexOf(baseYear);
    const baseStarIdx=baseDsIdx>=0?baseDayIdx(baseYear):-1;

    destroyChart("ac");
    const ctx=document.getElementById("cAccum");
    if(!ctx)return;
    chartInstances.ac=new Chart(ctx,{
      type:"line",
      data:{labels,datasets},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{mode:"index",intersect:false,callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y?fmt(c.parsed.y):'-'}`}},
          starMarker:baseDsIdx>=0?{point:baseStarIdx,datasetIdx:baseDsIdx,size:11}:false,
          zoom:{
            zoom:{
              wheel:{enabled:true,speed:0.1},
              pinch:{enabled:true},
              drag:{enabled:false},
              mode:'x'
            },
            pan:{enabled:true,mode:'x'},
            limits:{x:{min:'original',max:'original'}}
          }
        },
        scales:{
          y:{beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:10},callback:v=>fmtK(v)}},
          x:{ticks:{font:{family:"Pretendard,sans-serif",size:9},maxTicksLimit:12,autoSkip:true}}
        },
        onDoubleClick:()=>{}
      }
    });

    // 더블클릭 시 줌 리셋
    ctx.ondblclick=()=>{if(chartInstances.ac&&chartInstances.ac.resetZoom)chartInstances.ac.resetZoom()};

    const el=$("acCum");
    if(checked.length>=2){
      const cur=checked[0];
      const prev=checked[1];
      // 기준일까지의 누적값 비교 (기준일 이후는 null이라 마지막 유효값)
      const curArr=buildSeries(cur);
      const prevArr=buildSeries(prev);
      const curEnd=baseYear===cur?baseDayIdx(cur):curArr.length-1;
      const prevEnd=Math.min(curEnd,prevArr.length-1);
      // 기준일 시점 비교 (작년 같은 날짜까지의 누적)
      const curSum=curArr[curEnd]||0;
      const prevSum=prevArr[prevEnd]||0;
      const pct=prevSum?((curSum-prevSum)/prevSum)*100:null;
      if(el){
        if(pct!==null){el.textContent=`${cur}년 vs ${prev}년 (기준일 시점): ${pctText(pct)}`;el.className=`cumul ${pctClass(pct)}`}
        else{el.textContent="-";el.className="cumul"}
      }
    }else if(el){
      el.textContent="2개 이상 선택";el.className="cumul";
    }
  }

  chksDiv.addEventListener("change",render);
  render();
}

function drawYearWeekChart(allRows,latest){
  const yearWeekMap={};
  allRows.forEach(r=>{
    const{year,week}=getISOWeek(r.date);
    if(!yearWeekMap[year])yearWeekMap[year]=new Array(54).fill(null);
    if(yearWeekMap[year][week]===null)yearWeekMap[year][week]=0;
    yearWeekMap[year][week]+=r.total;
  });
  const years=Object.keys(yearWeekMap).map(Number).sort();
  const labels=[];for(let i=1;i<=52;i++)labels.push(i+"주");
  const baseColor=[45,106,79];
  const datasets=years.map((y,i)=>{
    const rev=years.length-1-i;
    const op=rev===0?1:rev===1?0.55:rev===2?0.35:rev===3?0.22:0.15;
    const w=rev===0?2.5:rev===1?2:1.5;
    return{
      label:y+"년",
      data:yearWeekMap[y].slice(1,53),
      borderColor:`rgba(${baseColor.join(",")},${op})`,
      backgroundColor:`rgba(${baseColor.join(",")},${op*0.08})`,
      borderWidth:w,tension:0.25,pointRadius:0,pointHoverRadius:4,spanGaps:false
    };
  });
  destroyChart("yw");
  chartInstances.yw=new Chart(document.getElementById("cYearWeek"),{
    type:"line",
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:"top",labels:{font:{family:"Pretendard,sans-serif",size:11},boxWidth:14,padding:8}},
        tooltip:{mode:"index",intersect:false,callbacks:{label:c=>c.parsed.y?`${c.dataset.label}: ${fmt(c.parsed.y)}`:`${c.dataset.label}: -`}}
      },
      scales:{
        y:{beginAtZero:true,ticks:{font:{family:"Pretendard,sans-serif",size:10},callback:v=>fmtK(v)}},
        x:{ticks:{font:{family:"Pretendard,sans-serif",size:9},maxTicksLimit:13,autoSkip:true}}
      }
    }
  });
}
